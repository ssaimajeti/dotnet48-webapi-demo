apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet48-webapi-demo
  namespace: default
  labels:
    app: dotnet48-webapi-demo
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: dotnet48-webapi-demo
  template:
    metadata:
      labels:
        app: dotnet48-webapi-demo
    spec:
      containers:
        - name: dotnet48-webapi-demo
          image: {{ .Values.image }}
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory | quote }}
              cpu: {{ .Values.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.memory | quote }}
              cpu: {{ .Values.resources.limits.cpu | quote }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      nodeSelector:
        kubernetes.io/os: windows
      tolerations:
        - key: "os"
          operator: "Equal"
          value: "windows"
          effect: "NoSchedule"