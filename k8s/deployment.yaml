apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet48-webapi-demo
  namespace: default
  labels:
    app: dotnet48-webapi-demo
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: dotnet48-webapi-demo
  template:
    metadata:
      labels:
        app: dotnet48-webapi-demo
    spec:
      containers:
        - name: dotnet48-webapi-demo
          image: {{ .Values.image }}
          ports:
            - containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      nodeSelector:
        kubernetes.io/os: windows